name: Build desktop launchers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Install packager
        run: python -m pip install pyinstaller==6.22.3
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onefile --name OpenCode-Portale --add-data "static:static" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Portale-${{ matrix.name }}
          path: dist/OpenCode-Portale*
